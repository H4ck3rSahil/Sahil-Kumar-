<style>
/* ==================== 1. CORE VARIABLES ==================== */
:root {
  --bg-dark: #050505;
  --bg-card: rgba(16, 18, 27, 0.85);
  --primary: #00ff41; /* Default Hack Green */
  --secondary: #00d4ff;
  --danger: #ff3860;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Space Grotesk', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: var(--font-sans); }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

.full-screen-view {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 20px; transition: all 0.5s ease; z-index: 1000;
}

/* ==================== 2. BACKGROUND & CRT ==================== */
#matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.25; pointer-events: none; }
.crt-overlay {
  position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  background-size: 100% 3px, 3px 100%; opacity: 0.6;
}
.vignette { position: fixed; inset: 0; z-index: 9998; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.95) 100%); pointer-events: none; }

#mainApp.show { display: block; animation: fadeIn 0.5s; background: radial-gradient(circle at center, rgba(0, 255, 65, 0.08) 0%, transparent 60%); }

#hackBgLayer { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.hack-bg-text {
  position: absolute; font-family: var(--font-mono); white-space: nowrap;
  color: rgba(0, 255, 65, 0.2); text-shadow: 0 0 8px rgba(0, 255, 65, 0.3);
  animation: floatUp linear infinite;
}
@keyframes floatUp { 0% { transform: translateY(110vh) scale(0.9); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1.1); opacity: 0; } }

/* ==================== 3. LOGIN SCREEN ==================== */
#loginScreen { z-index: 5000; background: rgba(0,0,0,0.5); }
#loginScreen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
.login-card {
  background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 255, 65, 0.3); border-radius: 24px;
  width: 100%; max-width: 400px; padding: 40px 30px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,65,0.05);
  text-align: center; position: relative; overflow: hidden;
}
.icon-wrapper {
  width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; background: rgba(0,255,65,0.08); border: 1px solid rgba(0,255,65,0.3);
  display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--primary);
  box-shadow: 0 0 30px rgba(0,255,65,0.2); animation: pulseGlow 2s infinite;
}
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 20px rgba(0,255,65,0.2); } 50% { box-shadow: 0 0 40px rgba(0,255,65,0.5); } }
.login-card h2 { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; }
.login-card p { font-size: 11px; color: var(--text-dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }

.input-group { text-align: left; margin-bottom: 20px; }
.input-group label { display: block; font-size: 11px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.input-wrapper { position: relative; }
.input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; transition: 0.3s; }
.input-wrapper input {
  width: 100%; padding: 15px 15px 15px 45px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; color: #fff; font-size: 14px; font-family: var(--font-mono); outline: none; transition: 0.3s;
}
.input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0,255,65,0.15); }
.input-wrapper input:focus + i { color: var(--primary); }
.btn-access {
  width: 100%; padding: 16px; margin-top: 10px; background: var(--primary); color: #000;
  font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-radius: 12px; transition: 0.3s;
  display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,255,65,0.2);
}
.btn-access:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0,255,65,0.4); }
.error-msg { color: var(--danger); font-size: 12px; margin-top: 15px; display: none; font-family: var(--font-mono); }
.error-msg.show { display: block; animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

/* ==================== 4. KALI TERMINAL ==================== */
#terminalScreen { z-index: 6000; background: #000; display: none; }
#terminalScreen.active { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.kali-window { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; width: 100%; max-width: 750px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; font-family: var(--font-mono); font-size: clamp(12px, 2.5vw, 15px); }
.kali-header { background: #161b22; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #30363d; }
.kali-dots { display: flex; gap: 8px; }
.kali-dot { width: 12px; height: 12px; border-radius: 50%; }
.kali-dot.red { background: #ff5f56; } .kali-dot.yellow { background: #ffbd2e; } .kali-dot.green { background: #27c93f; }
.kali-title { margin-left: auto; color: #8b949e; font-size: 12px; letter-spacing: 1px; }
.kali-body { padding: 20px; color: #c9d1d9; line-height: 1.8; height: 50vh; max-height: 400px; overflow-y: auto; }
.kali-body::-webkit-scrollbar { width: 6px; } .kali-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
.term-line { margin-bottom: 5px; word-wrap: break-word; }
.t-prompt { color: var(--secondary); font-weight: bold; }
.t-cmd { color: #fff; }
.t-output { color: var(--primary); padding-left: 20px; }
.blink-cursor { display: inline-block; width: 8px; height: 15px; background: var(--primary); animation: blink 1s step-end infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: 0; } }

/* ==================== 5. GLITCH & HACK EFFECT ==================== */
.system-glitch { animation: glitch-shake 0.1s infinite, glitch-flicker 0.15s infinite; pointer-events: none; }
@keyframes glitch-shake { 0% { transform: translate(0, 0); } 20% { transform: translate(-10px, 5px); } 40% { transform: translate(-5px, -10px); } 60% { transform: translate(10px, 10px); } 80% { transform: translate(5px, -5px); } 100% { transform: translate(0, 0); } }
@keyframes glitch-flicker { 0% { opacity: 1; filter: drop-shadow(0 0 10px red) hue-rotate(90deg); } 50% { opacity: 0.3; filter: drop-shadow(0 0 20px blue) hue-rotate(180deg); } 100% { opacity: 1; filter: none; } }
.rgb-split-overlay { position: fixed; inset: 0; z-index: 8000; pointer-events: none; display: none; background: linear-gradient(90deg, rgba(255,0,0,0.3) 0%, transparent 20%, transparent 80%, rgba(0,255,255,0.3) 100%); mix-blend-mode: screen; }
.rgb-split-overlay.active { display: block; animation: split-flicker 0.2s infinite; }
@keyframes split-flicker { 0% { transform: translateX(-10px); opacity: 0.8; } 50% { transform: translateX(10px); opacity: 0.2; } 100% { transform: translateX(-5px); opacity: 0.9; } }

/* ==================== 6. ACCESS GRANTED ==================== */
#accessGranted { position: fixed; inset: 0; z-index: 7000; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; }
#accessGranted.active { display: flex; }
.lock-wrap { position: relative; width: 150px; height: 170px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; }
.lock { width: 130px; height: 150px; color: var(--primary); filter: drop-shadow(0 0 18px currentColor); overflow: visible; animation: lockShake 0.5s 0.2s; }
.lock .shackle { transform-origin: 90px 62px; animation: shackleOpen 0.7s 0.9s cubic-bezier(.3,1.4,.5,1) forwards; }
.lock-ring { position: absolute; width: 100px; height: 100px; border: 3px solid var(--primary); border-radius: 50%; opacity: 0; animation: ringPulse 1s 1s ease-out forwards; }
#accessGranted.denied .lock { color: var(--danger); animation: lockShake 0.5s 0.2s; }
#accessGranted.denied .lock .shackle { animation: shackleClose 0.7s 0.9s ease-in-out forwards; }
#accessGranted.denied .lock-ring { border-color: var(--danger); }
#accessGranted.denied .granted-title { color: var(--danger); text-shadow: 0 0 20px var(--danger); animation: popIn 0.5s 1s both, deniedTitleFlicker 0.6s 1s 2; }
@keyframes shackleClose { 0%{transform:translateY(-16px) rotate(-38deg);} 45%{transform:translateY(-16px) rotate(0);} 100%{transform:translateY(0) rotate(0);} }
@keyframes deniedTitleFlicker { 0%,100%{text-shadow:0 0 20px var(--danger);} 25%{text-shadow:4px 0 #ff0040,-4px 0 #ff7a3d;} 50%{text-shadow:-4px 2px #ff0040,4px -2px #ff7a3d; transform:translateX(3px);} 75%{text-shadow:3px 0 #ff0040,-3px 0 #ff7a3d;} }
@keyframes lockShake { 0%,100%{transform:translateX(0) rotate(0);} 20%{transform:translateX(-8px) rotate(-4deg);} 40%{transform:translateX(8px) rotate(4deg);} 60%{transform:translateX(-6px) rotate(-3deg);} 80%{transform:translateX(6px) rotate(3deg);} }
@keyframes shackleOpen { 0%{transform:translateY(0) rotate(0);} 45%{transform:translateY(-16px) rotate(0);} 100%{transform:translateY(-16px) rotate(-38deg);} }
@keyframes ringPulse { 0%{opacity:.9; transform:scale(.6);} 100%{opacity:0; transform:scale(3);} }
.granted-title { font-family: var(--font-sans); font-size: clamp(30px, 6vw, 50px); font-weight: 800; color: var(--primary); letter-spacing: 10px; text-transform: uppercase; text-shadow: 0 0 20px var(--primary); text-align: center; opacity: 0; animation: popIn 0.5s 1s both, titleGlitch 0.6s 1s 2; }
@keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes titleGlitch { 0%,100%{text-shadow:0 0 20px var(--primary);} 25%{text-shadow:4px 0 #ff0040,-4px 0 #00e5ff;} 50%{text-shadow:-4px 2px #ff0040,4px -2px #00e5ff; transform:translateX(3px);} 75%{text-shadow:3px 0 #ff0040,-3px 0 #00e5ff;} }

.system-glitch-fail { animation: glitch-shake-fail 0.08s infinite, glitch-flicker-fail 0.12s infinite; pointer-events: none; }
@keyframes glitch-shake-fail { 0% { transform: translate(0,0); } 20% { transform: translate(-14px, 8px); } 40% { transform: translate(12px, -14px); } 60% { transform: translate(-10px, 12px); } 80% { transform: translate(14px, -6px); } 100% { transform: translate(0,0); } }
@keyframes glitch-flicker-fail { 0% { opacity: 1; filter: drop-shadow(0 0 16px red) saturate(3) contrast(1.6); } 40% { opacity: 0.25; filter: drop-shadow(0 0 24px #ff3860) invert(0.15); } 100% { opacity: 1; filter: none; } }
#alertFlash { position: fixed; inset: 0; z-index: 8100; pointer-events: none; display: none; background: repeating-linear-gradient(0deg, rgba(255,0,40,0.12) 0 2px, transparent 2px 4px); }
#alertFlash.active { display: block; animation: alertStrobe 0.15s infinite; }
@keyframes alertStrobe { 0%{background-color: rgba(255,0,40,0.0);} 50%{background-color: rgba(255,0,40,0.18);} 100%{background-color: rgba(255,0,40,0.0);} }

/* ==================== 6b. FLOATING HACK WINDOWS ==================== */
#hackLayer { position: fixed; inset: 0; z-index: 6500; pointer-events: none; overflow: hidden; }
.hwin {
  position: absolute; border: 1px solid var(--c); background: rgba(0,0,0,0.85); color: var(--c);
  box-shadow: 0 0 20px var(--c), inset 0 0 14px rgba(0,0,0,0.9); border-radius: 6px; overflow: hidden;
  font-family: var(--font-mono); font-size: 10px; line-height: 1.5; opacity: 0;
  animation: winIn 0.3s steps(5) forwards, winDrift var(--dur) ease-in-out infinite alternate;
}
@keyframes winIn { 0%{opacity:0; clip-path:inset(0 100% 0 0);} 40%{opacity:1; clip-path:inset(0 0 70% 0);} 100%{opacity:1; clip-path:inset(0);} }
@keyframes winDrift { 0%{transform:translate(0,0) rotate(var(--r0));} 100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r1));} }
.hwin.gl { filter: hue-rotate(140deg) contrast(1.6) saturate(2); transform: translateX(7px) skewX(-9deg) !important; }
.hw-head { background: var(--c); color: #000; padding: 3px 7px; font-weight: 800; display: flex; justify-content: space-between; letter-spacing: 1px; font-size: 10px; }
.hw-body { padding: 7px; min-height: 90px; }
.hw-log div, .hw-hex div { white-space: nowrap; overflow: hidden; }
.hw-bar { height: 6px; background: rgba(255,255,255,0.12); margin-top: 6px; border-radius: 3px; overflow: hidden; }
.hw-bar i { display: block; height: 100%; width: 0; background: var(--c); box-shadow: 0 0 8px var(--c); }
.hw-stat { margin-top: 5px; font-weight: 700; }
.hw-big { font-size: 15px; font-weight: 800; margin-bottom: 4px; text-shadow: 0 0 8px var(--c); overflow: hidden; white-space: nowrap; }
.radar-svg { width: 100%; height: 110px; display: block; }
.radar-sweep { transform-origin: 60px 60px; animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hw-blip { animation: blipPulse 0.6s infinite alternate; }
@keyframes blipPulse { from{opacity:.2;} to{opacity:1;} }

/* ==================== 7. MAIN DASHBOARD ==================== */
#mainApp { position: fixed; inset: 0; z-index: 100; display: none; background: transparent; overflow-y: auto; }
.top-nav { background: rgba(10,10,15,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,255,65,0.2); padding: 15px 20px; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 200; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
.nav-logo { font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-shadow: 0 0 15px rgba(0,255,65,0.6); }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; }
.menu-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; padding: 20px; }
.menu-header { text-align: center; margin-bottom: 25px; }
.menu-title { font-family: var(--font-sans); font-size: clamp(20px, 5vw, 28px); color: #fff; font-weight: 800; letter-spacing: 3px; text-shadow: 0 0 15px rgba(0,255,65,0.6); margin-bottom: 5px; white-space: nowrap; }
.menu-sub { color: var(--primary); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; font-family: var(--font-mono); opacity: 0.8; }
.menu-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 220px; }
.menu-btn {
  background: linear-gradient(180deg, rgba(0, 255, 65, 0.05) 0%, rgba(10, 12, 18, 0.9) 100%);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 255, 65, 0.3); border-radius: 8px; color: #fff;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
  padding: 12px 16px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: space-between;
}
.menu-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,255,65,0.25), transparent); transition: left 0.4s ease; }
.menu-btn:hover::before { left: 100%; }
@keyframes textGlitchFix { 0% { text-shadow: 2px 0 red, -2px 0 blue; transform: translateX(2px) skewX(5deg); } 25% { text-shadow: -2px 0 red, 2px 0 blue; transform: translateX(-2px) skewX(-5deg); } 50% { text-shadow: 2px 0 red, -2px 0 blue; transform: translateX(1px) skewX(2deg); } 100% { text-shadow: 0 0 10px var(--primary); transform: translateX(0) skewX(0); } }
.menu-btn:hover { animation-play-state: paused; background: linear-gradient(180deg, rgba(0, 255, 65, 0.15) 0%, rgba(10, 12, 18, 0.9) 100%); border-color: var(--primary); color: var(--primary); box-shadow: 0 8px 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,255,65,0.4), inset 0 0 10px rgba(0,255,65,0.2); transform: translateY(-2px) scale(1.02); }
.menu-btn:hover span { display: inline-block; animation: textGlitchFix 0.4s ease-out forwards; }
.menu-btn:active { transform: scale(0.96); background: rgba(0, 255, 65, 0.3); color: #000; }
.menu-btn i { font-size: 12px; color: var(--primary); opacity: 0.8; transition: 0.3s; }
.menu-btn:hover i { color: var(--primary); opacity: 1; transform: translateX(3px); }
.menu-btn.danger { background: linear-gradient(180deg, rgba(255, 56, 96, 0.05) 0%, rgba(10, 12, 18, 0.9) 100%); border-color: rgba(255, 56, 96, 0.3); }
.menu-btn.danger:hover { background: linear-gradient(180deg, rgba(255, 56, 96, 0.15) 0%, rgba(10, 12, 18, 0.9) 100%); border-color: var(--danger); color: var(--danger); box-shadow: 0 8px 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,56,96,0.4), inset 0 0 10px rgba(255,56,96,0.2); }
.menu-btn.danger i { color: var(--danger); }
.menu-btn.danger:hover i { color: var(--danger); }
.menu-btn.danger:active { background: rgba(255, 56, 96, 0.3); color: #fff; }

@keyframes slideInLeft { 0% { opacity: 0; transform: translateX(-150px) rotate(-10deg); filter: blur(8px); } 70% { opacity: 1; transform: translateX(15px) rotate(2deg); filter: blur(0); } 100% { opacity: 1; transform: translateX(0) rotate(0); filter: blur(0); } }
@keyframes slideInRight { 0% { opacity: 0; transform: translateX(150px) rotate(10deg); filter: blur(8px); } 70% { opacity: 1; transform: translateX(-15px) rotate(-2deg); filter: blur(0); } 100% { opacity: 1; transform: translateX(0) rotate(0); filter: blur(0); } }
@keyframes slideInBottom { 0% { opacity: 0; transform: translateY(100px) scale(0.8); filter: blur(8px); } 60% { opacity: 1; transform: translateY(-10px) scale(1.05); filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
@keyframes floatBtn { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.menu-buttons .menu-btn:nth-child(1) { animation: slideInLeft 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s backwards, floatBtn 4s ease-in-out 1s infinite; }
.menu-buttons .menu-btn:nth-child(2) { animation: slideInRight 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.25s backwards, floatBtn 4s ease-in-out 1.3s infinite; }
.menu-buttons .menu-btn:nth-child(3) { animation: slideInLeft 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s backwards, floatBtn 4s ease-in-out 1.6s infinite; }
.menu-buttons .menu-btn:nth-child(4) { animation: slideInRight 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.55s backwards, floatBtn 4s ease-in-out 1.9s infinite; }
.menu-buttons .menu-btn:nth-child(5) { animation: slideInBottom 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.7s backwards, floatBtn 4s ease-in-out 2.2s infinite; }
.menu-buttons .menu-btn:nth-child(6) { animation: slideInBottom 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.85s backwards, floatBtn 4s ease-in-out 2.5s infinite; }

/* ==================== 8. ANIMATED POPUP MODAL (THEMES) ==================== */
.content-popup { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; visibility: hidden; transition: all 0.3s ease; }
.content-popup.active { opacity: 1; visibility: visible; }

/* Base Popup Box */
.popup-box {
  background: rgba(8, 12, 10, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--primary); border-radius: 12px;
  width: 100%; max-width: 650px; max-height: 85vh; overflow-y: auto;
  padding: 30px; position: relative;
  box-shadow: 0 0 40px rgba(0, 255, 65, 0.2), inset 0 0 30px rgba(0, 255, 65, 0.05);
  transform: scale(0.9) translateY(20px); opacity: 0;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
  background-size: 20px 20px;
}
.content-popup.active .popup-box { transform: scale(1) translateY(0); opacity: 1; }

/* Theme Overrides */
.popup-box.theme-partner {
  border-color: #ff6ec7; background-color: #140812;

/* ==================== 9. THEMED WISH PAGE ==================== */
#wishPageContainer { position: fixed; inset: 0; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; overflow: hidden; transition: background 0.5s ease; }
#wishPageContainer.show { display: flex; animation: fadeIn 1s ease; }

/* Partner Theme */
#wishPageContainer.theme-partner { background-color: #0b0914; color: #f0eaff; font-family: 'Poppins', sans-serif; }
#wishPageContainer.theme-partner .bg-animation { position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 30%, rgba(255, 110, 199, 0.1) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(123, 97, 255, 0.1) 0%, transparent 40%); }

#wishPageContainer.theme-partner .hb-text { color: #fff; margin-bottom: 25px; letter-spacing: 1px; font-size: 16px; font-weight: 600; }
#wishPageContainer.theme-partner .wish-date-badge { background: rgba(255, 110, 199, 0.1); border: 1px solid rgba(255, 110, 199, 0.3); color: #ff6ec7; }
#wishPageContainer.theme-partner .btn-back-hack { border-color: #7b61ff; color: #7b61ff; }
#wishPageContainer.theme-partner .heart { background-color: #ff6ec7; }

/* Sibling Theme */
#wishPageContainer.theme-sibling { background-color: #141008; color: #fff; font-family: 'Poppins', sans-serif; }
#wishPageContainer.theme-sibling .bg-animation { position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 30%, rgba(255, 184, 0, 0.1) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.1) 0%, transparent 40%); }
#wishPageContainer.theme-sibling .name-text { font-family: 'Space Grotesk', sans-serif; background: linear-gradient(to right, #fff, #ffb800, #ff8c00, #fff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shine 3s linear infinite; line-height: 1.1; margin-bottom: 10px; font-size: clamp(40px, 9vw, 65px); font-weight: 800; }
#wishPageContainer.theme-sibling .hb-text { color: #ffe099; margin-bottom: 25px; letter-spacing: 1px; font-size: 16px; font-weight: 600; }
#wishPageContainer.theme-sibling .wish-date-badge { background: rgba(255, 184, 0, 0.1); border: 1px solid rgba(255, 184, 0, 0.3); color: #ffb800; }
#wishPageContainer.theme-sibling .btn-back-hack { border-color: #ffb800; color: #ffb800; }
#wishPageContainer.theme-sibling .heart { background-color: #ffb800; border-radius: 0; transform: rotate(0deg) !important; } /* Star shape for siblings */
#wishPageContainer.theme-sibling .heart::before, #wishPageContainer.theme-sibling .heart::after { display: none; }

/* Friend Theme */
#wishPageContainer.theme-friend { background-color: #081014; color: #fff; font-family: 'Poppins', sans-serif; }
#wishPageContainer.theme-friend .bg-animation { position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.1) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0, 255, 65, 0.1) 0%, transparent 40%); }
#wishPageContainer.theme-friend .name-text { font-family: 'Space Grotesk', sans-serif; background: linear-gradient(to right, #fff, #00d4ff, #00ff41, #fff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shine 3s linear infinite; line-height: 1.1; margin-bottom: 10px; font-size: clamp(40px, 9vw, 65px); font-weight: 800; }
#wishPageContainer.theme-friend .hb-text { color: #99ebff; margin-bottom: 25px; letter-spacing: 1px; font-size: 16px; font-weight: 600; }
#wishPageContainer.theme-friend .wish-date-badge { background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); color: #00d4ff; }
#wishPageContainer.theme-friend .btn-back-hack { border-color: #00d4ff; color: #00d4ff; }

#wishPageContainer.theme-friend .heart::before, #wishPageContainer.theme-friend .heart::after { display: none; }

/* Common Wish Page Elements */
.wish-content { position: relative; z-index: 10; max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center; }
.to-text { font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.6; margin-bottom: 5px; }
@keyframes shine { to { background-position: 200% center; } }
.media-frame { width: 100%; max-width: 300px; aspect-ratio: 3/4; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; position: relative; margin-bottom: 25px; }
#wishPageContainer.theme-partner .media-frame { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255, 110, 199, 0.2); }
#wishPageContainer.theme-sibling .media-frame { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255, 184, 0, 0.2); }
#wishPageContainer.theme-friend .media-frame { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(0, 212, 255, 0.2); }
.media-frame img { width: 100%; height: 100%; object-fit: cover; }
.wish-date-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; margin-bottom: 25px; }
.btn-back-hack { background: transparent; padding: 10px 20px; border-radius: 30px; font-size: 13px; cursor: pointer; transition: 0.3s; text-decoration: none; font-family: 'Poppins', sans-serif; }

.heart { position: absolute; bottom: -50px; width: 20px; height: 20px; animation: floatHeart linear infinite; opacity: 0.6; }
.heart::before, .heart::after { content: ''; position: absolute; width: 20px; height: 20px; background-color: inherit; border-radius: 50%; }
.heart::before { top: -10px; left: 0; } .heart::after { top: 0; left: -10px; }
@keyframes floatHeart { 0% { transform: translateY(0) rotate(45deg) scale(0.5); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translateY(-100vh) rotate(45deg) scale(1.5); opacity: 0; } }

/* ==================== 8. BIRTHDAY WISH & AUTO-CORRECT ==================== */
const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const monthMap = { "jan": "January", "feb": "February", "mar": "March", "apr": "April", "may": "May", "jun": "June", "jul": "July", "aug": "August", "sep": "September", "oct": "October", "nov": "November", "dec": "December" };

function formatMonth(val) { val = val.trim().toLowerCase(); if (monthMap[val]) return monthMap[val]; for (let m of monthNames) { if (m.startsWith(val) && val.length >= 3) return m.charAt(0).toUpperCase() + m.slice(1); } return val.charAt(0).toUpperCase() + val.slice(1); }
function formatDay(val) { let num = parseInt(val.replace(/[^0-9]/g, '')); if (isNaN(num) || num < 1) return "1"; if (num > 31) return "31"; return num.toString(); }

async function generateGFWish(category) {
  let name = document.getElementById('gfName').value.trim();
  let month = document.getElementById('gfMonth').value.trim();
  let day = document.getElementById('gfDay').value.trim();
  const fileInput = document.getElementById('gfPhoto');
  const btn = document.getElementById('btnGfWish');
  
  if (!name || !month || !day) { showMsg("Please fill Name, Month and Day!"); return; }
  if (fileInput.files.length === 0) { showMsg("Please select a photo!"); return; }

  month = formatMonth(month);
  day = formatDay(day);
  document.getElementById('gfMonth').value = month;
  document.getElementById('gfDay').value = day;

  const file = fileInput.files[0];
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPLOADING...';
  btn.disabled = true;

  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}.${fileExt}`;
    const { data: uploadData, error: uploadError } = await sb.storage.from('photos').upload(fileName, file);
    if (uploadError) throw uploadError;
    const { data: urlData } = sb.storage.from('photos').getPublicUrl(fileName);
    const imageUrl = urlData.publicUrl;

    const { data: dbData, error: dbError } = await sb.from('birthdays').insert([{ name: name, month: month, day: day, image_url: imageUrl }]).select();
    if (dbError) throw dbError;

    const newId = dbData[0].id;
    const baseUrl = window.location.origin + window.location.pathname;
    // URL includes the theme type
    const finalUrl = `${baseUrl}?wish=${newId}&type=${category.toLowerCase()}` + (window.extraParams ? extraParams() : '');

    document.getElementById('gfLink').value = finalUrl;
    document.getElementById('gfResult').style.display = 'block'; document.getElementById('gfResult').scrollIntoView({behavior:'smooth', block:'center'});
    
    btn.innerHTML = '<i class="fas fa-check"></i> LINK GENERATED!';
    btn.style.background = '#00e676';
    try { playChime(); } catch(e) {}

  } catch (error) {
    console.error(error);
    showMsg("Error: " + error.message);
    btn.innerHTML = '<i class="fas fa-magic"></i> GENERATE WISH LINK';
    btn.disabled = false;
  }
}

  document.getElementById('wishName').innerText = data.name;
  document.getElementById('wishDateText').innerText = `${data.month} ${data.day}`;
  document.getElementById('wishImage').src = data.image_url;

  createFloatingElements(themeType);
}

      container.appendChild(el);

    }, i * 200);
  }
}

/* ===== In-page message (replaces browser alert) ===== */
function showMsg(t){ const e=document.getElementById('toastMsg'); e.textContent=t; e.classList.add('show'); clearTimeout(window._tm); window._tm=setTimeout(()=>e.classList.remove('show'),3000); }

/* ===== Back button guard (only on main site, not on wish links) ===== */
(function(){
  if (new URLSearchParams(location.search).get('wish')) return;
  const modal=document.getElementById('exitModal');
  history.pushState({guard:1},'',location.href);
  let leaving=false;
  window.addEventListener('popstate',function(){
    if(leaving) return;
    modal.classList.add('show');
    history.pushState({guard:1},'',location.href);
  });
  document.getElementById('exitStay').onclick=()=>modal.classList.remove('show');
  document.getElementById('exitLeave').onclick=()=>{ modal.classList.remove('show'); leaving=true; history.go(-2); setTimeout(()=>{ try{window.close();}catch(e){} },400); };
})();
</script>
